<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Schedule - Register</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon">&#128118;</span>
        <h1>Create Your Family Group</h1>
        <p>Register a new group — pending admin approval</p>
      </div>
      <div id="inviteBanner" class="alert alert-success hidden"></div>
      <div id="inviteError" class="alert alert-error hidden"></div>
      <div id="successMsg" class="alert alert-success hidden">
        <span id="successText">Your group registration has been submitted!<br>
        A super-admin will review and approve your group.</span><br><br>
        <a href="/login">Back to Login</a>
      </div>
      <form id="registerForm">
        <div id="registerError" class="alert alert-error hidden"></div>
        <input type="hidden" id="inviteToken" name="inviteToken" value="">
        <div class="form-section-label">Your Account</div>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="Choose a username">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="At least 6 characters">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" placeholder="Repeat password">
        </div>
        <div id="groupFields">
          <div class="form-section-label">Your Family Group</div>
          <div class="form-group">
            <label for="groupName">Group Name</label>
            <input type="text" id="groupName" name="groupName" placeholder="e.g. Smith Family">
          </div>
          <div class="form-group">
            <label for="babyName">Baby's Name</label>
            <input type="text" id="babyName" name="babyName" placeholder="e.g. Emma">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Request Access</button>
      </form>
      <div class="auth-footer">
        <p>Already have an account? <a href="/login">Sign In</a></p>
      </div>
    </div>
  </div>

  <script>
    (async function initInvite() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('invite');
      if (!token) return;

      try {
        const res = await fetch(`/api/auth/invite-info/${encodeURIComponent(token)}`);
        const data = await res.json();
        if (data.valid) {
          document.getElementById('inviteToken').value = token;
          document.getElementById('groupFields').classList.add('hidden');
          document.getElementById('inviteBanner').innerHTML =
            `You've been invited to join <strong>${data.groupName}</strong> (Baby: ${data.babyName}). Fill in your details to join.`;
          document.getElementById('inviteBanner').classList.remove('hidden');
        } else {
          document.getElementById('registerForm').classList.add('hidden');
          document.getElementById('inviteError').textContent = 'This invite link is invalid or has expired.';
          document.getElementById('inviteError').classList.remove('hidden');
        }
      } catch (e) {
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('inviteError').textContent = 'Could not validate invite link.';
        document.getElementById('inviteError').classList.remove('hidden');
      }
    })();

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('registerError');
      errorEl.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const inviteToken = document.getElementById('inviteToken').value;
      const groupName = document.getElementById('groupName').value.trim();
      const babyName = document.getElementById('babyName').value.trim();

      if (password !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match';
        errorEl.classList.remove('hidden');
        return;
      }

      if (!inviteToken && (!groupName || !babyName)) {
        errorEl.textContent = 'Group name and baby name are required';
        errorEl.classList.remove('hidden');
        return;
      }

      const body = { username, email, password };
      if (inviteToken) {
        body.inviteToken = inviteToken;
      } else {
        body.groupName = groupName;
        body.babyName = babyName;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (res.ok) {
          document.getElementById('registerForm').classList.add('hidden');
          if (data.autoApproved) {
            document.getElementById('successText').innerHTML = 'Your account has been created and approved!<br>You can now log in.';
          }
          document.getElementById('successMsg').classList.remove('hidden');
        } else {
          errorEl.textContent = data.error || 'Registration failed';
          errorEl.classList.remove('hidden');
        }
      } catch (err) {
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
